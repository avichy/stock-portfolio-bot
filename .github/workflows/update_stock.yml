name: Update Stock Prices & Notifications

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # רץ כל שעה עגולה כדי לבדוק אם צריך לשלוח פוש ולעדכן

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pytz

      - name: Run update script and check notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add .
          git commit -m "Auto-update stock prices and portfolio [skip ci]" || echo "No changes to commit"
          git push
